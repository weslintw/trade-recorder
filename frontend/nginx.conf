server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 關閉 HTTP/3 (QUIC)：Zeabur edge 預設 advertise HTTP/3，但部分使用者
    # 網路對 UDP 不友善，會導致每個 request 先嘗試 QUIC、失敗、fallback 到
    # TCP，造成嚴重卡頓。用 Alt-Svc: clear 告訴瀏覽器清掉 cached HTTP/3
    # advertisement。always 確保即使 4xx/5xx response 也會送出。
    add_header Alt-Svc 'clear' always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 圖片快取
    location ~* \.(jpg|jpeg|png|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # JS/CSS快取
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;
}

